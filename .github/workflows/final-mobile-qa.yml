name: Final mobile QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/suri-http.log 2>&1 &
          echo $! >/tmp/suri-http.pid
          sleep 2

      - name: iPhone render and interaction QA
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
          const brokenLoadedImages = async locator => locator.evaluateAll(imgs =>
            imgs.filter(i => i.getAttribute('src') && (!i.complete || i.naturalWidth === 0))
                .map(i => ({ alt: i.alt, src: i.src.slice(0, 80) }))
          );

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 393, height: 852 },
              deviceScaleFactor: 2,
              isMobile: true,
              hasTouch: true,
            });

            const errors = [];
            page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
            page.on('console', m => { if (m.type() === 'error') errors.push(`console: ${m.text()}`); });

            const response = await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            assert(response && response.ok(), `Page failed to load: ${response && response.status()}`);
            assert((await page.title()) === 'SURI Fitness — Golf Ready', 'Unexpected page title');
            await page.waitForSelector('#planCard .exercise');

            // Every image that has actually been assigned a source must decode.
            let broken = await brokenLoadedImages(page.locator('img'));
            assert(broken.length === 0, `Broken images on initial plan: ${JSON.stringify(broken)}`);

            // Day-before mobility section must include all six real exercise images.
            const mobilityRows = page.locator('#planCard .work-section').filter({ hasText: 'Back + hip mobility' }).locator('.exercise');
            assert(await mobilityRows.count() === 6, 'Expected 6 day-before mobility exercises');
            const mobilityImgs = mobilityRows.locator('img');
            assert(await mobilityImgs.count() === 6, `Expected all 6 mobility exercises to have images; found ${await mobilityImgs.count()}`);
            broken = await brokenLoadedImages(mobilityImgs);
            assert(broken.length === 0, `Broken mobility images: ${JSON.stringify(broken)}`);

            // Every golf-activation exercise must use a real decoded photo in the plan.
            const activationRows = page.locator('#planCard .work-section').filter({ hasText: 'Golf activation' }).locator('.exercise');
            assert(await activationRows.count() === 6, 'Expected 6 day-before activation exercises');
            assert(await activationRows.locator('.glyph').count() === 0, 'Activation plan contains glyph fallbacks');
            const activationPlanImgs = activationRows.locator('img');
            assert(await activationPlanImgs.count() === 6, `Expected all 6 activation exercises to have images; found ${await activationPlanImgs.count()}`);
            broken = await brokenLoadedImages(activationPlanImgs);
            assert(broken.length === 0, `Broken activation plan images: ${JSON.stringify(broken)}`);

            // Tapping anywhere on a plan card except its checkbox opens the full exercise detail.
            const previewRow = activationRows.first();
            const progressBeforePreview = await page.locator('.progress-meta').innerText();
            await previewRow.locator('.exercise-name').click();
            await page.waitForSelector('#detailSheet.open');
            assert((await page.locator('#sheetTitle').innerText()).trim() === 'Cable row', 'Exercise card opened the wrong detail');
            assert(await page.locator('#sheetImg').isVisible(), 'Plan photo preview is not visible');
            assert(await page.locator('#sheetImg').evaluate(i => i.complete && i.naturalWidth > 0), 'Plan photo preview failed to decode');
            assert(await page.locator('#sheetImg').evaluate(i => i.clientWidth > 0 && Math.abs((i.clientWidth / i.clientHeight) - (i.naturalWidth / i.naturalHeight)) < 0.02), 'Large preview is cropped or distorted');
            assert(await page.locator('#sheetImg').evaluate(i => getComputedStyle(i).objectFit === 'contain'), 'Large preview does not preserve the full image');
            assert(await page.locator('.progress-meta').innerText() === progressBeforePreview, 'Opening exercise detail unexpectedly completed the exercise');
            await page.locator('#closeSheet').click();

            // Only the checkbox hit area may change exercise completion and progress.
            const firstExercise = page.locator('#planCard .exercise').first();
            const firstProgress = await page.locator('.progress-meta').innerText();
            await firstExercise.locator('.exercise-name').click();
            await page.waitForSelector('#detailSheet.open');
            assert(await page.locator('.progress-meta').innerText() === firstProgress, 'Tapping exercise content unexpectedly marked it complete');
            await page.locator('#closeSheet').click();
            await firstExercise.locator('.check-button').click();
            assert(await firstExercise.evaluate(el => el.classList.contains('done')), 'Exercise did not mark complete');
            assert((await page.locator('.progress-meta').innerText()).includes('1 /'), 'Progress did not update');

            // Library navigation and mobility images.
            await page.locator('.nav-item[data-screen="library"]').first().click();
            await page.waitForSelector('#libraryScreen.active');
            assert(await page.locator('#libraryList .lib-row').count() === 6, 'Mobility library should have 6 rows');
            broken = await brokenLoadedImages(page.locator('#libraryList img'));
            assert(broken.length === 0, `Broken library images: ${JSON.stringify(broken)}`);

            // Exercise detail sheet must show a decoded large image.
            await page.locator('#libraryList .lib-row').first().click();
            await page.waitForSelector('#detailSheet.open');
            assert(await page.locator('#sheetImg').isVisible(), 'Exercise detail image is not visible');
            assert(await page.locator('#sheetImg').evaluate(i => i.complete && i.naturalWidth > 0), 'Exercise detail image failed to decode');
            await page.locator('#closeSheet').click();

            // Activation library must show all six real photos, with no glyph fallback.
            await page.locator('[data-lib="activation"]').click();
            assert(await page.locator('#libraryList .lib-row').count() === 6, 'Activation library should have 6 rows');
            assert(await page.locator('#libraryList .glyph').count() === 0, 'Activation library contains glyph fallbacks');
            const activationLibraryImgs = page.locator('#libraryList img');
            assert(await activationLibraryImgs.count() === 6, `Expected 6 activation library images; found ${await activationLibraryImgs.count()}`);
            broken = await brokenLoadedImages(activationLibraryImgs);
            assert(broken.length === 0, `Broken activation images: ${JSON.stringify(broken)}`);

            // Each activation detail sheet must show the matching decoded photo.
            for (let i = 0; i < 6; i++) {
              const row = page.locator('#libraryList .lib-row').nth(i);
              const expectedName = (await row.locator('b').innerText()).trim();
              const expectedSrc = await row.locator('img').getAttribute('src');
              await row.click();
              await page.waitForSelector('#detailSheet.open');
              assert((await page.locator('#sheetTitle').innerText()).trim() === expectedName, `Wrong detail title for ${expectedName}`);
              assert(await page.locator('#sheetImg').isVisible(), `Detail image is not visible for ${expectedName}`);
              assert(await page.locator('#sheetImg').getAttribute('src') === expectedSrc, `Wrong detail image for ${expectedName}`);
              assert(await page.locator('#sheetImg').evaluate(i => i.complete && i.naturalWidth > 0), `Detail image failed to decode for ${expectedName}`);
              await page.locator('#closeSheet').click();
            }

            // Every 0–7 day plan must render and every assigned image must decode.
            await page.locator('.nav-item[data-screen="plan"]').first().click();
            for (const d of [7,6,5,4,3,2,1,0]) {
              await page.locator(`[data-day="${d}"]`).click();
              await page.waitForSelector('#planCard .exercise');
              const count = await page.locator('#planCard .exercise').count();
              assert(count > 0, `No exercises rendered for day ${d}`);
              const bad = await brokenLoadedImages(page.locator('#planCard img'));
              assert(bad.length === 0, `Broken images for day ${d}: ${JSON.stringify(bad)}`);
            }

            // Week and safety screens.
            await page.locator('.nav-item[data-screen="week"]').first().click();
            assert(await page.locator('#weekScreen.active .week-row').count() === 7, 'Weekly plan should have 7 rows');
            await page.locator('.nav-item[data-screen="safety"]').first().click();
            assert(await page.locator('#safetyScreen.active .alert').count() >= 3, 'Safety content missing');

            assert(errors.length === 0, errors.join('\n'));
            await page.screenshot({ path: 'final-mobile.png', fullPage: true });
            await browser.close();
            console.log('FINAL MOBILE QA PASSED');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Upload final mobile screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-mobile-qa
          path: final-mobile.png
          if-no-files-found: ignore
